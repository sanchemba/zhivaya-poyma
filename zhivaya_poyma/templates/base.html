{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Живая пойма{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Проект о живой пойме, бобрах, дубравах и реке.{% endblock %}">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
    <a class="skip-link" href="#content">Перейти к содержанию</a>

    {% include "includes/header.html" %}
    {% include "includes/messages.html" %}

    <main id="content">
        {% block content %}{% endblock %}
    </main>

    {% include "includes/footer.html" %}
    <script src="{% static 'js/site.js' %}" defer></script>
</body>
</html>
