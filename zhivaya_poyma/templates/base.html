{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Живая Пойма{% endblock %}">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  <link href="https://api.fontshare.com/v2/css?f[]=boska@400,500,700&f[]=general-sans@300,400,500,600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="site-bg" aria-hidden="true">
    <div class="site-bg__gradient"></div>
    <div class="site-bg__layer site-bg__layer--back"></div>
    <div class="site-bg__layer site-bg__layer--mid"></div>
    <div class="site-bg__layer site-bg__layer--front"></div>
  </div>

  <a class="skip-link" href="#content">К содержимому</a>

  {% include "includes/header.html" %}
  {% include "includes/messages.html" %}

  <main id="content">
    {% block content %}{% endblock %}
  </main>

  {% include "includes/footer.html" %}

  <script src="{% static 'js/site.js' %}" defer></script>
</body>
</html>
