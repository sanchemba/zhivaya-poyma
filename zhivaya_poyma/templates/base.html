{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Rehabi" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Живая Пойма{% endblock %}">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  
</head>
<body>
  <div class="site-bg" aria-hidden="true">
    <div class="site-bg__gradient"></div>
    <div class="site-bg__layer site-bg__layer--back"></div>
    <div class="site-bg__layer site-bg__layer--mid"></div>
    <div class="site-bg__layer site-bg__layer--front"></div>
  </div>

  <a class="skip-link" href="#content">К содержимому</a>

  {% include "includes/header.html" %}
  {% include "includes/messages.html" %}

  <main id="content">
    {% block content %}{% endblock %}
  </main>

  {% include "includes/footer.html" %}

  <script src="{% static 'js/site.js' %}" defer></script>
</body>
</html>
