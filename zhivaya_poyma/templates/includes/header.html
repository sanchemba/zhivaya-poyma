{% load static %}

<header class="site-header">
  <div class="container site-header__inner">
    <a href="{% url 'core:home' %}" class="site-logo">
      <img
        src="{% static 'img/logo/zhivayapoyma_logo_01.svg' %}"
        alt="Живая Пойма"
        class="site-logo__mark"
        width="180"
        height="48"
      >
      <span class="site-logo__wordmark">Живая Пойма</span>
    </a>

    <nav class="site-nav" aria-label="Основная навигация">
      <a href="{% url 'core:home' %}">Главная</a>
      <a href="{% url 'core:about' %}">О проекте</a>
      <a href="/news/">Дневник</a>
      <a href="{% url 'core:contacts' %}">Контакты</a>
    </nav>

    <button
      class="mobile-menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="mobile-menu"
      aria-label="Открыть меню"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <div class="mobile-menu" id="mobile-menu" hidden>
    <div class="container mobile-menu__inner">
      <a href="{% url 'core:home' %}">Главная</a>
      <a href="{% url 'core:about' %}">О проекте</a>
      <a href="/news/">Дневник</a>
      <a href="{% url 'core:contacts' %}">Контакты</a>
    </div>
  </div>
</header>
